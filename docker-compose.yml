services:
  postgres:
    image: postgres:16-alpine
    container_name: segen-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: segen
      POSTGRES_PASSWORD: segen
      POSTGRES_DB: segen
    ports:
      - "5432:5432"
    volumes:
      - segen-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U segen -d segen"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: segen-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - segen-redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  segen-pgdata:
  segen-redisdata:
